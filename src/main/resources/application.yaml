spring:
  application:
    name: be_laptop4you
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://localhost:3306/laptop4you

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  logging:
    config: classpath:logback-spring.xml
    level:
      com.kevin.be_laptop4you: INFO